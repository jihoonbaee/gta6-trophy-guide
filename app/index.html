<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Vice City Trophy Codex</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell mast-grid">
      <div class="identity">
        <p class="eyebrow">Grand Theft Auto VI <span>◆</span> PlayStation 5</p>
        <h1>Vice City <em>Trophy Codex</em></h1>
        <p id="citation-audit" class="citation-audit"></p>
      </div>
      <section class="progress-card" aria-label="Trophy progress">
        <div class="progress-heading">
          <span class="eyebrow">Platinum progress</span>
          <strong id="progress-total" aria-live="polite">—</strong>
        </div>
        <progress id="progress-meter" aria-label="Earned trophies" value="0" max="55"></progress>
        <div id="grade-counts" class="grade-counts"></div>
      </section>
    </div>
  </header>

  <main class="shell">
    <div class="view-bar">
      <nav aria-label="Codex views">
        <button id="show-checklist" type="button" aria-controls="checklist-view" aria-pressed="true">Checklist</button>
        <button id="show-roadmap" type="button" aria-controls="roadmap-view" aria-pressed="false">Roadmap</button>
      </nav>
      <p id="save-status" class="save-status" role="status">Loading Codex…</p>
    </div>

    <section id="checklist-view" aria-label="Trophy checklist" hidden>
      <div class="toolbar" aria-label="Checklist controls">
        <label class="search"><span class="sr-only">Search trophy names</span><input id="name-search" type="search" placeholder="Search trophies…"></label>
        <label class="select-control">Kind <select id="kind-filter"><option value="">All</option><option value="story">Story</option><option value="collectibles">Collectibles</option><option value="activities">Activities</option></select></label>
        <label class="select-control">Status <select id="earned-filter"><option value="">Any</option><option value="earned">Earned</option><option value="unearned">Unearned</option></select></label>
        <label class="check-control"><input id="missable-filter" type="checkbox"> Missable only</label>
        <label class="check-control shield"><input id="spoiler-shield" type="checkbox" role="switch"> Spoiler shield <span id="shield-state" aria-hidden="true">OFF</span></label>
        <div class="backup">
          <button id="export-progress" type="button">Export JSON</button>
          <button id="import-progress" type="button">Import JSON</button>
          <input id="progress-file" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="list-heading">
        <h2>Trophy list</h2>
        <p id="result-count" aria-live="polite"></p>
      </div>
      <div id="checklist-layout" class="checklist-layout">
        <ul id="trophy-list" class="trophy-list"></ul>
        <aside id="guide-panel" class="guide-panel" aria-label="Trophy guide" hidden></aside>
      </div>
    </section>

    <section id="roadmap-view" aria-labelledby="roadmap-title" hidden>
      <div class="list-heading roadmap-heading">
        <h2 id="roadmap-title">Route to platinum</h2>
        <p>5 stages · Check cutoffs before advancing</p>
      </div>
      <div id="roadmap-stages" class="roadmap-grid"></div>
    </section>
    <p id="app-error" role="alert" hidden></p>
  </main>
</body>
</html>
